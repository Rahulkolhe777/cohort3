<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        
        <aside class="sidebar">
            <div class="about-me-tab">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="2" width="4" height="4" fill="#333"/>
                    <rect x="2" y="6" width="4" height="4" fill="#333"/>
                    <rect x="10" y="6" width="4" height="4" fill="#333"/>
                    <rect x="6" y="10" width="4" height="4" fill="#333"/>
                </svg>
                <span>About Me</span>
            </div>
            
            <div class="sidebar-text">
                <span>Clients</span>
                <span>Research</span>
                <span>Portfolio</span>
                <span>Podcast</span>
            </div>
        </aside>
        
        <main class="main-content">
            
            <div class="profile-card">
                <div class="bg-shape">
                    <div class="bg-shape-top">
                        <div class="notch-space"></div>
                        <div class="inner-corner">
                            <div class="inner-corner-mask"></div>
                        </div>
                        <div class="bg-solid-top"></div>
                    </div>
                    <div class="bg-solid-bottom"></div>
                </div>
                
                <div class="profile-content">
                    <div class="profile-img-container">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop" alt="Jon Daniel" class="profile-img">
                    </div>
                                                                  
                    <h2 class="profile-name"><span class="font-light">Im,</span><br>Jon<br>Daniel</h2>
                    
                    <div class="profile-footer">
                        <div class="email">inquiry@jondaniel.design <i class="far fa-envelope"></i></div>
                        <div class="badge">
                            <svg viewBox="0 0 100 100" class="rotating-badge">
                                <path id="curve" d="M 50,50 m -30,0 a 30,30 0 1,1 60,0 a 30,30 0 1,1 -60,0" fill="transparent"/>
                                <text>
                                    <textPath href="#curve" startOffset="0" fill="#fff" font-size="11" letter-spacing="2" font-weight="600">
                                        2023 MY DESIGN PORTFOLIO • 
                                    </textPath>
                                </text>
                            </svg>
                            <div class="badge-center"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="heading-container">
                <h1 class="portfolio-title">Portfolio<span class="corner-mark-title"></span></h1>
            </div>
            
            <div class="video-card card">
                <img src="https://images.unsplash.com/photo-1534008897995-27a23e859048?q=80&w=600&auto=format&fit=crop" alt="Flamingo" class="video-img">
                <div class="play-btn"><i class="fas fa-play"></i></div>
                <div class="corner-mark-card"></div>
            </div>
            
            <div class="projects-card card left-align-card">
                <div class="corner-mark-card"></div>
                <h3 class="number-title text-black">251</h3>
                <p class="subtitle text-dark">Projects</p>
            </div>
            
            <div class="awards-card card left-align-card">
                <div class="corner-mark-card"></div>
                <h3 class="number-title text-white">156</h3>
                <p class="subtitle text-white">Awards</p>
            </div>
            
            <div class="clients-card card center-align-card">
                <div class="corner-mark-card"></div>
                <i class="fab fa-apple apple-icon"></i>
                <p class="subtitle text-white">Clients</p>
            </div>
            
            <div class="dual-card card">
                <div class="dual-left">
                    <div class="css-sphere"></div>
                </div>
                <div class="dual-right left-align-card">
                    <div class="corner-mark-card black-mark"></div>
                    <h3 class="number-title text-black">172</h3>
                    <p class="subtitle text-black">Global Design<br>Awards.</p>
                </div>
            </div>
            
        </main>
        
    </div>
</body>
</html>
